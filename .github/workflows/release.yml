name: Release

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install shiv
        run: pip install shiv

      - name: Build
        run: make build

      - name: Checksums
        run: make checksums

      - name: Commit checksums to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout main
          cp dist/SHA256SUMS CHECKSUMS
          git add CHECKSUMS
          git commit -m "chore: update CHECKSUMS for ${{ github.ref_name }}" || echo "no changes"
          git push origin main

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: dist/SHA256SUMS
          files: |
            dist/patch-checker.pyz
            dist/patch-checker-ssh.pyz
