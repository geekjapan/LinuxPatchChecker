[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "linux-patch-checker"
version = "0.2.0"
requires-python = ">=3.8"
dependencies = []

[project.optional-dependencies]
build = ["shiv>=1.0"]
scan = ["paramiko>=3.0"]

[tool.setuptools.packages.find]
include = ["patch_checker*"]

[tool.setuptools.package-data]
patch_checker = ["data/*.json"]

[project.scripts]
patch-checker = "patch_checker.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
