[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "linux-patch-checker"
version = "0.1.0"
requires-python = ">=3.8"
dependencies = ["paramiko>=3.0", "pyyaml>=6.0"]

[tool.setuptools.packages.find]
include = ["patch_checker*"]

[project.scripts]
patch-checker = "patch_checker.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
